name: Tag on version bump

# When a push to main changes MARKETING_VERSION and v<version> does not exist yet, create the tag and start the
# Release workflow. A tag pushed with GITHUB_TOKEN does not trigger other workflows, so Release is started
# explicitly with workflow_dispatch (the one event GITHUB_TOKEN may trigger).
on:
  push:
    branches: [main]
    paths: ["Keyloom.xcodeproj/project.pbxproj"]

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        run: |
          versions="$(grep -E 'MARKETING_VERSION = ' Keyloom.xcodeproj/project.pbxproj | sed -E 's/.*= ([^;]+);/\1/' | sort -u)"
          if [[ "$(wc -l <<<"$versions")" -ne 1 || -z "$versions" ]]; then
            echo "MARKETING_VERSION is not a single value: $versions"; exit 1
          fi
          echo "VERSION=$versions" >> "$GITHUB_ENV"

      - name: Create tag and start the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists; nothing to do"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Keyloom $VERSION"
          git push origin "refs/tags/$tag"
          gh workflow run release.yml --ref main -f version="$VERSION"
